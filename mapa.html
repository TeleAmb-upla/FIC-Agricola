<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador Agrícola - TeleAmb</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <!-- Panel Lateral -->
    <div class="sidebar">
        <!-- Encabezado con Logo -->
        <div class="sidebar-header">
            <img src="./assets/img/TeleAmb.png" alt="Logo TeleAmb" class="logo-map">
            <h1 class="app-title">Explorador Agrícola</h1>
        </div>

        <!-- Sección de Controles Principales -->
        <div class="control-group">
            <div class="section-title">Indices espectrales</div>
            <select id="layerSelector" class="control-input">
                <option value="ndvi">NDVI</option>
                <option value="ndwi">NDWI</option>
                <option value="evi">EVI</option>
            </select>
        </div>

        <!-- Descarga de Datos -->
        <div class="control-group">
            <div class="section-title">Exportar Datos</div>
            <div class="download-options">
                <select id="formatSelector" class="control-input">
                    <option value="csv">CSV</option>
                    <option value="geotiff">GeoTIFF</option>
                    <option value="shp">Shapefile</option>
                </select>
                <button id="downloadButton" class="download-button">Descargar</button>
            </div>
        </div>
    </div> <!-- ← Cierre del div.sidebar -->

    <!-- Contenedor Principal Mapa + Gráfico -->
    <div class="main-container">
        <!-- Mapa -->
        <div id="map"></div>
        
        <!-- Espacio para Gráficos -->
        <div id="chart-container">
            <h3 class="chart-title"></h3>
            <div id="d3-chart"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster@1.0.0-beta.9/dist/georaster.browser.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet@1.6.0/dist/georaster-layer-for-leaflet.browser.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="./assets/js/map.js"></script>
    <script src="./assets/js/chart.js"></script>
</body>
</html>
